spring.application.name=notificaciones

# Base de datos MySQL / Laragon
spring.datasource.url=jdbc:mysql://localhost:3306/db_notificaciones?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto
server.port=8088

# Puertos del equipo Click and Eat
# ms-usuario        -> 8080
# ms-restaurante    -> 8081
# ms-productos      -> 8082
# ms-pedidos        -> 8083
# ms-carrito        -> 8084
# ms-repartidores   -> 8085
# ms-resenias       -> 8086
# ms-notificaciones -> 8087
# ms-pagos          -> 8088

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
